groups:
  - name: voltgrid_alerts
    rules:
      - alert: StationRelayLagHigh
        expr: outbox_events_lag > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Outbox relay lag is high in station-service"
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service instance is unreachable"
