groups:
  - name: voltgrid_alerts
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service instance {{ $labels.service }} is unreachable"
          description: "Service has been down for more than 1 minute."

      - alert: StationRelayLagHigh
        expr: voltgrid_outbox_unpublished > 50
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Outbox relay lag is high in station-service"
          description: "Pending transactional outbox events exceed 50 for 3 minutes."

      - alert: StationQuarantinedEventsDetected
        expr: voltgrid_outbox_quarantined > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Poison outbox events quarantined"
          description: "Outbox events have exceeded maximum delivery retries and require operator replay."

      - alert: OcppHandshakeFailureRateHigh
        expr: rate(voltgrid_ocpp_handshake_failures_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Elevated OCPP WebSocket handshake failures"
          description: "Handshake failure rate exceeds 0.1/s over 5 minutes."

      - alert: OperationsProjectionLagHigh
        expr: voltgrid_operations_projection_lag_seconds > 10
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Operations projection lag is high"
          description: "Delay between station status change and read projection update exceeds 10 seconds."
