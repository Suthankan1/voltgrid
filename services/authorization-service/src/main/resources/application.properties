spring.application.name=authorization-service
server.port=${SERVER_PORT:8082}

spring.datasource.url=${AUTHORIZATION_DB_URL:jdbc:postgresql://localhost:5435/voltgrid_authorization}
spring.datasource.username=${AUTHORIZATION_DB_USER:voltgrid}
spring.datasource.password=${AUTHORIZATION_DB_PASSWORD:voltgrid_dev}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

voltgrid.authorization.token-hmac-key=${AUTHORIZATION_TOKEN_HMAC_KEY:}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db

logging.pattern.correlation=[trace_id=%X{trace_id:-} span_id=%X{span_id:-}] 
