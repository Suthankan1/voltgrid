spring.datasource.url=${AUTHORIZATION_DB_URL:jdbc:postgresql://localhost:5435/voltgrid_authorization}
spring.datasource.username=${AUTHORIZATION_DB_USER:voltgrid}
spring.datasource.password=${AUTHORIZATION_DB_PASSWORD:voltgrid_dev}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

voltgrid.authorization.token-hmac-key=${AUTHORIZATION_TOKEN_HMAC_KEY:voltgrid-local-development-hmac-key-change-me}