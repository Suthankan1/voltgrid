spring.application.name=operations-service

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:operations-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

voltgrid.kafka.station-status-topic=voltgrid.station-status-changed.v1

spring.datasource.url=${OPERATIONS_DB_URL:jdbc:postgresql://localhost:5436/voltgrid_operations}
spring.datasource.username=${OPERATIONS_DB_USER:voltgrid}
spring.datasource.password=${OPERATIONS_DB_PASSWORD:voltgrid_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true