spring.application.name=station-service

spring.datasource.url=${STATION_DB_URL:jdbc:postgresql://localhost:5434/voltgrid_station}
spring.datasource.username=${STATION_DB_USER:voltgrid}
spring.datasource.password=${STATION_DB_PASSWORD:voltgrid_dev}

spring.jpa.open-in-view=false

voltgrid.station.stale-after-seconds=600
voltgrid.station.liveness-check-interval=1m
voltgrid.station.liveness-check-initial-delay=1m

spring.grpc.client.channel.authorization.target=static://${AUTHORIZATION_GRPC_HOST:localhost}:${AUTHORIZATION_GRPC_PORT:9090}
spring.grpc.client.channel.authorization.ssl.enabled=false