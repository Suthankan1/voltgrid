spring.application.name=station-service

spring.datasource.url=${STATION_DB_URL:jdbc:postgresql://localhost:5434/voltgrid_station}
spring.datasource.username=${STATION_DB_USER:voltgrid}
spring.datasource.password=${STATION_DB_PASSWORD:voltgrid_dev}

spring.jpa.open-in-view=false

voltgrid.station.stale-after-seconds=600
voltgrid.station.liveness-check-interval=1m
voltgrid.station.liveness-check-initial-delay=1m

spring.grpc.client.channel.authorization.target=static://${AUTHORIZATION_GRPC_HOST:localhost}:${AUTHORIZATION_GRPC_PORT:9090}
spring.grpc.client.channel.authorization.ssl.enabled=false

voltgrid.authorization.grpc-deadline=1s

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

voltgrid.kafka.station-status-topic=voltgrid.station-status-changed.v1
voltgrid.kafka.outbox.publish-timeout=5s

voltgrid.kafka.outbox.relay-enabled=${OUTBOX_RELAY_ENABLED:false}
voltgrid.kafka.outbox.poll-delay-ms=${OUTBOX_POLL_DELAY_MS:1000}
voltgrid.kafka.outbox.max-events-per-poll=${OUTBOX_MAX_EVENTS_PER_POLL:25}