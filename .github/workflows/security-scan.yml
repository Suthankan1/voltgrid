name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sca-frontend:
    name: Frontend SCA (pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/operator-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "26"

      - name: Install pnpm
        run: npm install --global pnpm@12.4.2

      - name: Run pnpm audit (Production)
        run: pnpm audit --prod

  sca-and-sbom-backend:
    name: Backend SBOM & SCA (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Generate CycloneDX SBOM for Station Service
        run: ./services/station-service/mvnw -f services/station-service/pom.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom

      - name: Generate CycloneDX SBOM for Operations Service
        run: ./services/operations-service/mvnw -f services/operations-service/pom.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom

      - name: Generate CycloneDX SBOM for Authorization Service
        run: ./services/authorization-service/mvnw -f services/authorization-service/pom.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom

      - name: Enforce Java dependency vulnerability policy
        env:
          TRIVY_IMAGE: aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb # 0.76.2
        run: |
          mkdir -p "${RUNNER_TEMP}/trivy-db" security-reports
          docker run --rm -v "${RUNNER_TEMP}/trivy-db:/root/.cache/trivy" "$TRIVY_IMAGE" image --download-db-only
          docker run --rm -v "${RUNNER_TEMP}/trivy-db:/root/.cache/trivy" "$TRIVY_IMAGE" version
          result=0
          for service in authorization operations station; do
            if ! docker run --rm --network none \
              -v "${RUNNER_TEMP}/trivy-db:/root/.cache/trivy" \
              -v "$PWD/services/$service-service/target/bom.json:/fixture.json:ro" \
              "$TRIVY_IMAGE" sbom --skip-db-update --pkg-types library \
              --severity HIGH,CRITICAL --exit-code 42 --format json /fixture.json \
              > "security-reports/$service.json"; then
              printf '::error::Trivy policy check failed for %s dependencies\n' "$service"
              result=1
            fi
          done
          exit "$result"

      - name: Archive SBOM and vulnerability reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: voltgrid-sboms
          path: |
            services/station-service/target/bom.json
            services/station-service/target/bom.xml
            services/operations-service/target/bom.json
            services/operations-service/target/bom.xml
            services/authorization-service/target/bom.json
            services/authorization-service/target/bom.xml
            security-reports/*.json
          retention-days: 14
