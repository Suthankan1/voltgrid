name: Operations Service CI

on:
  push:
    branches:
      - main
    paths:
      - "services/operations-service/**"
      - ".github/workflows/operations-service.yml"

  pull_request:
    branches:
      - main
    paths:
      - "services/operations-service/**"
      - ".github/workflows/operations-service.yml"

permissions:
  contents: read

concurrency:
  group: operations-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Operations Service
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: services/operations-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: services/operations-service/pom.xml

      - name: Verify Java
        run: java --version

      - name: Verify Docker
        run: docker version

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            clean test