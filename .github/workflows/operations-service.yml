name: Operations Service CI

on:
  push:
    branches:
      - main
    paths:
      - "services/operations-service/**"
      - ".github/workflows/operations-service.yml"

  pull_request:
    branches:
      - main
    paths:
      - "services/operations-service/**"
      - ".github/workflows/operations-service.yml"

permissions:
  contents: read

concurrency:
  group: operations-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Operations Service
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: services/operations-service

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 25
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: services/operations-service/pom.xml

      - name: Verify Java
        run: java --version

      - name: Verify Docker
        run: docker version

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        env:
          VOLTGRID_SECURITY_REQUIRE_AUTH: "false"
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            clean test

      - name: Verify signed access tokens with authentication required
        run: ./mvnw --batch-mode --no-transfer-progress -Dtest=OperationsJwtHttpAcceptanceTests,KeycloakAccessTokenPolicyTests test
