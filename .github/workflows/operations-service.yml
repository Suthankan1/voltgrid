name: Operations Service CI

on:
  push:
    branches:
      - main
    paths:
      - "services/operations-service/**"
      - ".github/workflows/operations-service.yml"

  pull_request:
    paths:
      - "services/operations-service/**"
      - ".github/workflows/operations-service.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operations-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Operations Service
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: services/operations-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: services/operations-service/pom.xml

      - name: Verify Java
        run: java --version

      - name: Verify Docker
        run: docker version

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            clean test

  publish:
    name: Publish ARM64 Image to ECR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ap-southeast-1
      ECR_REPOSITORY: voltgrid/operations-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::657347292859:role/voltgrid-dev-github-actions-ecr
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "657347292859"
          role-session-name: voltgrid-operations-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.3.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Build and push Operations Service image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./services/operations-service/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}