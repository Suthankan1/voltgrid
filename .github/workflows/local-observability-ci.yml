name: Local Observability CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'observability/local/**'
      - 'tests/infrastructure/verify-local-observability-ports.py'
      - '.github/workflows/local-observability-ci.yml'
  push:
    branches: [main]
    paths:
      - 'observability/local/**'
      - 'tests/infrastructure/verify-local-observability-ports.py'
      - '.github/workflows/local-observability-ci.yml'

permissions:
  contents: read

concurrency:
  group: local-observability-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-port-bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 tests/infrastructure/verify-local-observability-ports.py
