name: Authorization Service CI

on:
  push:
    branches:
      - main
    paths:
      - "services/authorization-service/**"
      - "contracts/authorization/**"
      - ".github/workflows/authorization-service-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "services/authorization-service/**"
      - "contracts/authorization/**"
      - ".github/workflows/authorization-service-ci.yml"

permissions:
  contents: read

concurrency:
  group: authorization-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: services/authorization-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: services/authorization-service/pom.xml

      - name: Verify with Maven
        run: ./mvnw --batch-mode --no-transfer-progress verify

  publish:
    name: Publish ARM64 Image to ECR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ap-southeast-1
      ECR_REPOSITORY: voltgrid/authorization-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::657347292859:role/voltgrid-dev-github-actions-ecr
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "657347292859"
          role-session-name: voltgrid-authorization-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.3.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Build and push Authorization Service image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./services/authorization-service/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}