name: Authorization Flow E2E

on:
  push:
    branches:
      - main
    paths:
      - "integration-tests/authorization-flow/**"
      - "services/station-service/**"
      - "services/authorization-service/**"
      - "contracts/authorization/**"
      - ".github/workflows/authorization-flow-e2e.yml"

  pull_request:
    branches:
      - main
    paths:
      - "integration-tests/authorization-flow/**"
      - "services/station-service/**"
      - "services/authorization-service/**"
      - "contracts/authorization/**"
      - ".github/workflows/authorization-flow-e2e.yml"

permissions:
  contents: read

concurrency:
  group: authorization-flow-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorization-flow-e2e:
    name: Authorization Flow E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Show Java version
        run: java --version

      - name: Run authorization flow integration tests
        working-directory: integration-tests/authorization-flow
        run: |
          mvn \
            --batch-mode \
            --no-transfer-progress \
            clean test