name: Operator Web CI

on:
  push:
    branches: [main]
    paths: ["apps/operator-web/**", ".github/workflows/operator-web-ci.yml", "compose.oidc-test.yaml", "integration-tests/oidc/**"]
  pull_request:
    branches: [main]
    paths: ["apps/operator-web/**", ".github/workflows/operator-web-ci.yml", "compose.oidc-test.yaml", "integration-tests/oidc/**"]

permissions:
  contents: read

concurrency:
  group: operator-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/operator-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Install pinned package manager
        run: npm install --global pnpm@12.4.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Client regression tests
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: TypeScript type check
        run: pnpm exec tsc --noEmit
      - name: Production build
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start isolated OIDC provider
        working-directory: .
        run: |
          export VG_TEST_OIDC_CLIENT_SECRET=$(openssl rand -hex 32)
          export VG_TEST_OIDC_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$VG_TEST_OIDC_CLIENT_SECRET"
          echo "::add-mask::$VG_TEST_OIDC_PASSWORD"
          docker compose -f compose.oidc-test.yaml up -d
          issuer=http://127.0.0.1:8180/realms/voltgrid-test
          curl -fsS --retry 20 --retry-all-errors --retry-delay 2 "$issuer/.well-known/openid-configuration" >/dev/null
          {
            echo "OIDC_ISSUER=$issuer"
            echo "OIDC_CLIENT_ID=voltgrid-operator-web"
            echo "OIDC_CLIENT_SECRET=$VG_TEST_OIDC_CLIENT_SECRET"
            echo "VG_TEST_OIDC_PASSWORD=$VG_TEST_OIDC_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Operator browser regression tests
        run: pnpm test:e2e
      - name: Automated accessibility tests (WCAG 2.2 AA)
        run: pnpm test:a11y

  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    defaults:
      run:
        working-directory: apps/operator-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Install pinned package manager
        run: npm install --global pnpm@12.4.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm build
      - name: Install Chromium, Firefox, and WebKit
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Start isolated OIDC provider
        working-directory: .
        run: |
          export VG_TEST_OIDC_CLIENT_SECRET=$(openssl rand -hex 32)
          export VG_TEST_OIDC_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$VG_TEST_OIDC_CLIENT_SECRET"
          echo "::add-mask::$VG_TEST_OIDC_PASSWORD"
          docker compose -f compose.oidc-test.yaml up -d
          issuer=http://127.0.0.1:8180/realms/voltgrid-test
          curl -fsS --retry 20 --retry-all-errors --retry-delay 2 "$issuer/.well-known/openid-configuration" >/dev/null
          {
            echo "OIDC_ISSUER=$issuer"
            echo "OIDC_CLIENT_ID=voltgrid-operator-web"
            echo "OIDC_CLIENT_SECRET=$VG_TEST_OIDC_CLIENT_SECRET"
            echo "VG_TEST_OIDC_PASSWORD=$VG_TEST_OIDC_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Cross-browser operator matrix
        run: pnpm test:e2e:cross-browser
