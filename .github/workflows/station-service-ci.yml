name: Station Service CI

on:
  push:
    branches:
      - main
    paths:
      - "services/station-service/**"
      - "contracts/authorization/**"
      - ".github/workflows/station-service-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "services/station-service/**"
      - "contracts/authorization/**"
      - ".github/workflows/station-service-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: station-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: services/station-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: services/station-service/pom.xml

      - name: Verify with Maven
        run: ./mvnw --batch-mode --no-transfer-progress verify

  publish:
    name: Publish and Deploy Station Service
    runs-on: ubuntu-latest
    timeout-minutes: 40

    needs:
      - build

    if: github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ap-southeast-1
      ECR_REPOSITORY: voltgrid/station-service

      ECS_CLUSTER: voltgrid-dev-cluster
      ECS_SERVICE: voltgrid-dev-station-service
      ECS_TASK_DEFINITION: voltgrid-dev-station-service
      ECS_CONTAINER_NAME: station-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::657347292859:role/voltgrid-dev-github-actions-ecr
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "657347292859"
          role-session-name: voltgrid-station-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.3.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Build and push Station Service image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./services/station-service/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Download current Station task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --region "$AWS_REGION" \
            --query taskDefinition \
            > station-task-definition.json

      - name: Render Station task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: station-task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy Station Service to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true