services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: voltgrid_station
      POSTGRES_USER: voltgrid
      POSTGRES_PASSWORD: voltgrid_dev
    ports:
      - "5434:5432"
    volumes:
      - station-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voltgrid -d voltgrid_station"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  station-postgres-data: